# Toda la configuración que cambia entre entornos llega por variables de entorno.
# Las variables sin valor por defecto son obligatorias: si faltan, la aplicación no arranca.
spring.application.name=reservas
server.port=8080

# ---------- Base de datos (adaptador de persistencia) ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CLAVE}
# El esquema lo crea schema.sql; Hibernate solo verifica que las entidades coincidan con las tablas.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- Seguridad (usuarios de la API) ----------
app.seguridad.gestor.usuario=${GESTOR_USUARIO}
app.seguridad.gestor.clave=${GESTOR_CLAVE}
app.seguridad.consulta.usuario=${CONSULTA_USUARIO}
app.seguridad.consulta.clave=${CONSULTA_CLAVE}

# ---------- Errores ----------
# Respuestas de error con el formato Problem Details (RFC 9457) y sin la traza de la pila.
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- Actuator ----------
# Solo se exponen health (healthcheck y prueba de humo) e info (versión desplegada).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
# APP_VERSION queda fija en la imagen al construirla (ARG VERSION del Dockerfile). La prueba de humo la compara.
info.app.version=${APP_VERSION:local}
